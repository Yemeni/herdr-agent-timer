id = "yemeni.agent-timer"
name = "Agent Timer"
version = "0.2.4"
min_herdr_version = "0.8.0"
description = "Alternate agent status labels with a reboot-safe persistent timer"
platforms = ["linux"]

[[startup]]
command = ["bash", "timer.sh", "--ensure"]

[[actions]]
id = "start"
title = "Start agent timer"
contexts = ["global"]
command = ["bash", "timer.sh", "--start"]

[[actions]]
id = "stop"
title = "Stop agent timer"
contexts = ["global"]
command = ["bash", "timer.sh", "--stop"]

[[actions]]
id = "toggle"
title = "Toggle agent timer"
contexts = ["global"]
command = ["bash", "timer.sh", "--toggle"]

[[events]]
on = "pane.created"
command = ["bash", "timer.sh", "--ensure"]
